<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  
  <!-- Background Shield -->
  <rect width="64" height="64" rx="14" fill="#050814" />
  <rect width="60" height="60" x="2" y="2" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Outer Rotating Orbital Ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="url(#orbitGrad)" stroke-width="2.5" stroke-dasharray="24 8" />
  
  <!-- Inner Defense Ring -->
  <circle cx="32" cy="32" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
  
  <!-- Tactical Energy Core -->
  <circle cx="32" cy="32" r="10" fill="url(#coreGlow)" />
  <circle cx="32" cy="32" r="4" fill="#ffffff" />
  
  <!-- Orbital Nodes -->
  <circle cx="32" cy="10" r="3" fill="#f59e0b" stroke="#ffffff" stroke-width="1" />
  <circle cx="32" cy="54" r="3" fill="#f59e0b" stroke="#ffffff" stroke-width="1" />
  <circle cx="10" cy="32" r="2.5" fill="#00f3ff" />
  <circle cx="54" cy="32" r="2.5" fill="#00f3ff" />
</svg>
